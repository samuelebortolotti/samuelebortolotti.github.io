title: Samuele Bortolotti's personal web page
author: Samuele Bortolotti
email: samuele.bortolotti@unitn.it
lang: en
description: >-
  Personal web page of Samuele Bortolotti, Ph.D. candidate in Computer Science at
  the University of Trento, working on machine learning, trustworthy AI and
  neuro-symbolic integration.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://samuelebortolotti.github.io" # the base hostname & protocol for your site, e.g. http://example.com
github_username: samuelebortolotti
repository: samuelebortolotti/samuelebortolotti.github.io

# Used by jekyll-seo-tag for the "sameAs" list in the Person JSON-LD block
social:
  name: Samuele Bortolotti
  links:
    - https://github.com/samuelebortolotti
    - https://www.linkedin.com/in/samuele-bortolotti
    - https://scholar.google.com/citations?user=w7Cv80sAAAAJ

# Markdown / math
markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax

# Build settings
encoding: UTF-8
future: true   # show publications/news dated ahead of the build clock
plugins:
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

# Publications collection
collections:
  publications:
    output: true
    permalink: /publications/:title

# Kept out of the built site (in addition to Jekyll's own defaults).
exclude:
  - Makefile
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - Rakefile
  - scripts
  - cv
