  # bullet points
  "**Supervisors**: [Stefano Teso](https://stefanoteso.github.io/) and [Andrea Passerini](https://disi.unitn.it/~passerini/index.html)": "**Relatori**: [Stefano Teso](https://stefanoteso.github.io/) e [Andrea Passerini](https://disi.unitn.it/~passerini/index.html)"
  "**PhD Scholarship:** Trustworthy Neuro-Symbolic Machine Learning": "**Borsa di dottorato:** Trustworthy Neuro-Symbolic Machine Learning"
  "**GPA**: 4.0/4.0": "**Media**: 4.0/4.0"
  "**Grade**: 110/110 cum laude": "**Voto**: 110/110 e lode"
  '**Final dissertation**: _"From Models to Arguments and Back"_, supervised by professors [Andrea Passerini](https://disi.unitn.it/~passerini/index.html) and [Stefano Teso](https://stefanoteso.github.io/)': '**Tesi di laurea**: _"From Models to Arguments and Back"_, relatori i professori [Andrea Passerini](https://disi.unitn.it/~passerini/index.html) e [Stefano Teso](https://stefanoteso.github.io/)'
  '**Final dissertation**: _"Analysis of user warnings in Wikipedia"_, supervised by professor [Alberto Montresor](https://cricca.disi.unitn.it/montresor/)': '**Tesi di laurea**: _"Analysis of user warnings in Wikipedia"_, relatore il professor [Alberto Montresor](https://cricca.disi.unitn.it/montresor/)'
  "Work on a novel interactive multi-shot debugging protocol that allows the exchange of arguments between a machine and a user in order to correct the model's beliefs.": "Sviluppo di un nuovo protocollo interattivo di debugging multi-shot che consente lo scambio di argomentazioni tra macchina e utente per correggere le convinzioni del modello."
  "Integrate state-of-the-art eXplainable Artificial Intelligence techniques, such as the ['Right for the Right Reasons'](https://arxiv.org/pdf/1703.03717.pdf) loss, into structured prediction output Neuro-Symbolic models like [Coherent Hierarchical Multi-label Classification Networks](https://proceedings.neurips.cc//paper/2020/file/6dd4e10e3296fa63738371ec0d5df818-Paper.pdf) and [Semantic Probabilistic Layers](https://proceedings.neurips.cc/paper_files/paper/2022/file/c182ec594f38926b7fcb827635b9a8f4-Paper-Conference.pdf).": "Integrazione di tecniche allo stato dell'arte di eXplainable Artificial Intelligence, come la loss ['Right for the Right Reasons'](https://arxiv.org/pdf/1703.03717.pdf), in modelli neuro-simbolici a predizione strutturata come [Coherent Hierarchical Multi-label Classification Networks](https://proceedings.neurips.cc//paper/2020/file/6dd4e10e3296fa63738371ec0d5df818-Paper.pdf) e [Semantic Probabilistic Layers](https://proceedings.neurips.cc/paper_files/paper/2022/file/c182ec594f38926b7fcb827635b9a8f4-Paper-Conference.pdf)."
  "Successfully recover the performance of confounded models in the field of hierarchical classification.": "Recupero delle prestazioni di modelli confusi nell'ambito della classificazione gerarchica."
  "Extract Wikipedia data from the Wikipedia dumps - 937GB bz2 and 157GB 7z compressed.": "Estrazione di dati dai dump di Wikipedia - 937GB compressi in bz2 e 157GB in 7z."
  "Design an effective way to extract and analyze the languages spoken by the Wikipedia users - 109'452 database entries.": "Progettazione di un metodo efficace per estrarre e analizzare le lingue parlate dagli utenti di Wikipedia - 109'452 record."
  "Develop a strategy to retrieve Wikipedia users' _User Warnings_ and _Wikibreaks_, studying how they affect the users' activity level - respectively 25'843 and 2'777'181 database entries.": "Sviluppo di una strategia per recuperare gli _User Warnings_ e i _Wikibreaks_ degli utenti di Wikipedia, studiandone l'effetto sul livello di attività - rispettivamente 25'843 e 2'777'181 record."
  "Build an automated pipeline to download the dumps, extract the data, and compute the statistics using Docker.": "Realizzazione di una pipeline automatizzata per scaricare i dump, estrarre i dati e calcolare le statistiche con Docker."
  "Create corporate libraries with the aim of handling database connections regardless of the database management system (SQLite, PostgreSQL, MySQL, and Oracle) in Java.": "Creazione di librerie aziendali per gestire le connessioni ai database indipendentemente dal DBMS (SQLite, PostgreSQL, MySQL e Oracle) in Java."
  "Develop a Java-based internal software function that can calculate the distance between two buildings using GIS data.": "Sviluppo di una funzione software interna in Java per calcolare la distanza tra due edifici a partire da dati GIS."
  "Develop a web application in HTML5, CSS3, and JavaScript to show the obtained results.": "Sviluppo di un'applicazione web in HTML5, CSS3 e JavaScript per visualizzare i risultati."
  "Contribute to the development of an internal Customer Relationship Management System using Java, JavaScript, HTML5, CSS3, and MySQL.": "Contributo allo sviluppo di un sistema interno di Customer Relationship Management in Java, JavaScript, HTML5, CSS3 e MySQL."
  "Introduction to machine learning, probability theory and linear algebra. Standard machine learning algorithms such as decision trees, k-nearest neighbors, Bayesian networks, support vector machines, and kernel machines, along with an introduction to neural networks and deep learning. Model evaluation, parameter estimation, and common techniques in unsupervised and reinforcement learning.": "Introduzione al machine learning, alla teoria della probabilità e all'algebra lineare. Algoritmi classici di machine learning come alberi di decisione, k-nearest neighbors, reti bayesiane, support vector machine e kernel machine, con un'introduzione alle reti neurali e al deep learning. Valutazione dei modelli, stima dei parametri e tecniche comuni di apprendimento non supervisionato e per rinforzo."
  "Fundamentals of web development, including HTTP protocol, HTML, JavaScript, CSS, request-response cycle, asynchronous JavaScript frameworks (AJAX, AJAJ), state persistence, and database interaction, with practical experience in common web technologies, DOM manipulation, and the design and development of simple web applications using Java Spring.": "Fondamenti di sviluppo web: protocollo HTTP, HTML, JavaScript, CSS, ciclo richiesta-risposta, tecniche JavaScript asincrone (AJAX, AJAJ), persistenza dello stato e interazione con i database, con esperienza pratica sulle principali tecnologie web, la manipolazione del DOM e la progettazione e lo sviluppo di semplici applicazioni web con Java Spring."
  "**Acceptance rate**: 18%.": "**Tasso di ammissione**: 18%."
  "**Topics**: Probabilistic models, bayesian workflow, variational inference and optimization, deep generative models, diffusion models, Monte Carlo methods, probabilistic circuits, gaussian processes and causal inference.": "**Argomenti**: modelli probabilistici, workflow bayesiano, inferenza e ottimizzazione variazionale, modelli generativi profondi, modelli di diffusione, metodi Monte Carlo, circuiti probabilistici, processi gaussiani e inferenza causale."
  "Visiting the [APRIL](https://april-tools.github.io/) Lab under the supervision of professor [Antonio Vergari](http://nolovedeeplearning.com/).": "Visita all'[APRIL](https://april-tools.github.io/) Lab sotto la supervisione del professor [Antonio Vergari](http://nolovedeeplearning.com/)."
  "Research project on Constraint Learning using Large Language Models.": "Progetto di ricerca su constraint learning con Large Language Models."

