# Translations for the resume pages, keyed by the English string from _data/cv.yml.
# Missing keys fall back to English. Proper nouns (institutions, lab / talk / paper
# titles, venues, people) are intentionally left in English.
# scripts/cv_i18n_check.rb reports keys that no longer match _data/cv.yml.

# Strings that stay as-is in every language (checked, but not "missing").
keep:
  - "Premio allo studio Marco Modena (Cassa Rurale Alto Garda - Rovereto, Trento, IT)"
  - "NeurIPS Conference Financial Assistance Award"

