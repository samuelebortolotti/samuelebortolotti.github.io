  "Introduction to machine learning, probability theory and linear algebra. Standard machine learning algorithms such as decision trees, k-nearest neighbors, Bayesian networks, support vector machines, and kernel machines, along with an introduction to neural networks and deep learning. Model evaluation, parameter estimation, and common techniques in unsupervised and reinforcement learning.": "Einführung in Machine Learning, Wahrscheinlichkeitstheorie und lineare Algebra. Klassische Machine-Learning-Verfahren wie Entscheidungsbäume, k-nächste Nachbarn, bayessche Netze, Support Vector Machines und Kernel-Methoden sowie eine Einführung in neuronale Netze und Deep Learning. Modellbewertung, Parameterschätzung und gängige Verfahren des unüberwachten und des bestärkenden Lernens."
