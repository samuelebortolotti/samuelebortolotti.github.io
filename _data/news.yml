- date: 2026-05-05
  en: 'I gave an invited talk, _"How to Learn and Not Learn Concepts, Symbols, and Representations"_, at the [University of Edinburgh](https://informatics.ed.ac.uk/), together with [Emanuele Marconato](https://emanuele-marconato.github.io/).'
