- date: 2026-03-01
  url: https://april-tools.github.io/
  en: 'I started a three-month research visit to the [APRIL Lab](https://april-tools.github.io/) at the [University of Edinburgh](https://informatics.ed.ac.uk/), working with [Antonio Vergari](https://nolovedeeplearning.com/) on constraint acquisition with Large Language Models.'
  it: 'Ho iniziato un periodo di ricerca di tre mesi presso l''[APRIL Lab](https://april-tools.github.io/) della [University of Edinburgh](https://informatics.ed.ac.uk/), lavorando con [Antonio Vergari](https://nolovedeeplearning.com/) su constraint acquisition con i Large Language Models.'
  de: 'Ich habe einen dreimonatigen Forschungsaufenthalt am [APRIL Lab](https://april-tools.github.io/) der [University of Edinburgh](https://informatics.ed.ac.uk/) begonnen und arbeite dort mit [Antonio Vergari](https://nolovedeeplearning.com/) an constraint acquisition mit Large Language Models.'

