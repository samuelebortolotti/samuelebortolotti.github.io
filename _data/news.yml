  de: 'Ich habe einen eingeladenen Vortrag gehalten, _"How to Learn and Not Learn Concepts, Symbols, and Representations"_, an der [University of Edinburgh](https://informatics.ed.ac.uk/), gemeinsam mit [Emanuele Marconato](https://emanuele-marconato.github.io/).'

